<script>
/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
  "https://uqtjszxgvefzhydqnmik.supabase.co";

/*
  VIGTIGT:

  SLET teksten DIN_PUBLISHABLE_KEY_HER nedenfor
  og indsæt din Publishable key fra Supabase.

  Brug IKKE Secret key.
*/

const SUPABASE_KEY =
  "sb_publishable_36u1t6M3nNr7VjeN6nVMaA_BUOu0jJf";


const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================================
   ELEMENTER
========================================================= */

const pinScreen =
  document.getElementById("pinScreen");

const loginScreen =
  document.getElementById("loginScreen");

const chatScreen =
  document.getElementById("chatScreen");

const pinInput =
  document.getElementById("pinInput");

  document.getElementById("passwordInput");

  document.getElementById("loginButton");

  document.getElementById("loginError");

  document.getElementById("messageInput");

  document.getElementById("sendButton");

  document.getElementById("settingsOverlay");

  document.getElementById("closeSettingsButton");

const logoutButton =
  document.getElementById("logoutButton");

const lockButton =
  document.getElementById("lockButton");

const changePinButton =
  document.getElementById("changePinButton");

const statusText =
  document.getElementById("statusText");


/* =========================================================
   APP DATA
========================================================= */

let currentUser = null;

let recipientId = null;

let realtimeChannel = null;

let pinUnlocked = false;


/* =========================================================
   HJÆLPEFUNKTIONER
========================================================= */

function showOnly(screen) {

  pinScreen.classList.add("hidden");
  loginScreen.classList.add("hidden");
  chatScreen.classList.add("hidden");

  screen.classList.remove("hidden");
}


function scrollToBottom() {

  setTimeout(() => {

    messagesContainer.scrollTop =
      messagesContainer.scrollHeight;

  }, 50);
}


function escapeHTML(text) {

  const div = document.createElement("div");

  div.textContent = text;

  return div.innerHTML;
}


function formatTime(dateString) {

  const date =
    new Date(dateString);

  return date.toLocaleTimeString(
    "da-DK",
    {
      hour: "2-digit",
      minute: "2-digit"
    }
  );
}

/* =========================================================
   PIN - SIKKER LOKAL LAGRING
========================================================= */

const PIN_STORAGE_KEY =
  "elektriker_handbog_pin_secure";

const OLD_PIN_STORAGE_KEY =
  "elektriker_handbog_pin";


function hasSavedPin() {

  return !!(
    localStorage.getItem(PIN_STORAGE_KEY) ||
    localStorage.getItem(OLD_PIN_STORAGE_KEY)
  );
}


function bytesToBase64(bytes) {

  let binary = "";

  bytes.forEach(byte => {
    binary += String.fromCharCode(byte);
  });

  return btoa(binary);
}


function base64ToBytes(base64) {

  const binary = atob(base64);

  return Uint8Array.from(
    binary,
    char => char.charCodeAt(0)
  );
}


async function createPinHash(pin, salt) {

  const encoder =
    new TextEncoder();

  const keyMaterial =
    await crypto.subtle.importKey(
      "raw",
      encoder.encode(pin),
      "PBKDF2",
      false,
      ["deriveBits"]
    );

  const derivedBits =
    await crypto.subtle.deriveBits(
      {
        name: "PBKDF2",
        salt: salt,
        iterations: 200000,
        hash: "SHA-256"
      },
      keyMaterial,
      256
    );

  return new Uint8Array(
    derivedBits
  );
}


async function savePinSecurely(pin) {

  const salt =
    crypto.getRandomValues(
      new Uint8Array(16)
    );

  const hash =
    await createPinHash(
      pin,
      salt
    );

  const record = {
    salt: bytesToBase64(salt),
    hash: bytesToBase64(hash)
  };

  localStorage.setItem(
    PIN_STORAGE_KEY,
    JSON.stringify(record)
  );

  // Fjern gammel PIN i klartekst,
  // hvis den findes.
  localStorage.removeItem(
    OLD_PIN_STORAGE_KEY
  );
}


async function verifyPin(pin) {

  const secureRecord =
    localStorage.getItem(
      PIN_STORAGE_KEY
    );


  // Ny sikker metode
  if (secureRecord) {

    try {

      const record =
        JSON.parse(secureRecord);

      const salt =
        base64ToBytes(
          record.salt
        );

      const savedHash =
        base64ToBytes(
          record.hash
        );

      const enteredHash =
        await createPinHash(
          pin,
          salt
        );


      if (
        savedHash.length !==
        enteredHash.length
      ) {
        return false;
      }


      let difference = 0;

      for (
        let i = 0;
        i < savedHash.length;
        i++
      ) {

        difference |=
          savedHash[i] ^
          enteredHash[i];
      }

      return difference === 0;

    } catch (error) {

      console.error(
        "PIN-data kunne ikke læses",
        error
      );

      return false;
    }
  }


  // Hvis den gamle version af appen
  // allerede har gemt PIN i klartekst:
  const oldPin =
    localStorage.getItem(
      OLD_PIN_STORAGE_KEY
    );

  if (
    oldPin &&
    pin === oldPin
  ) {

    // Flyt automatisk over
    // til den nye sikre lagring.
    await savePinSecurely(pin);

    return true;
  }


  return false;
}


function setupPinScreen() {

  pinInput.value = "";
  pinError.textContent = "";

  if (!hasSavedPin()) {

    pinSetupText.textContent =
      "Første gang: vælg en personlig PIN på 4-6 cifre";

    pinButton.textContent =
      "Gem PIN";

  } else {

    pinSetupText.textContent =
      "Indtast din personlige PIN";

    pinButton.textContent =
      "Åbn håndbog";
  }


  showOnly(pinScreen);


  setTimeout(
    () => pinInput.focus(),
    150
  );
}


async function handlePin() {

  const enteredPin =
    pinInput.value.trim();


  if (
    !/^\d{4,6}$/.test(
      enteredPin
    )
  ) {

    pinError.textContent =
      "PIN skal være 4-6 tal.";

    return;
  }


  pinButton.disabled = true;


  // Ingen PIN endnu =
  // første opsætning
  if (!hasSavedPin()) {

    await savePinSecurely(
      enteredPin
    );

    pinUnlocked = true;

    pinButton.disabled = false;

    await continueAfterPin();

    return;
  }


  const correct =
    await verifyPin(
      enteredPin
    );


  pinButton.disabled = false;


  if (!correct) {

    pinError.textContent =
      "Forkert PIN.";

    pinInput.value = "";

    pinInput.focus();

    return;
  }


  pinUnlocked = true;

  await continueAfterPin();
}


async function continueAfterPin() {

  const {
    data: { session }
  } =
    await supabaseClient.auth.getSession();


  if (session?.user) {

    currentUser =
      session.user;

    await openChat();

  } else {

    showOnly(
      loginScreen
    );
  }
}


pinButton.addEventListener(
  "click",
  handlePin
);


pinInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter"
    ) {

      handlePin();
    }
  }
);


/* =========================================================
   LOGIN
========================================================= */

async function login() {

  loginError.textContent = "";

  const email =
    emailInput.value.trim();

  const password =
    passwordInput.value;


  if (!email || !password) {

    loginError.textContent =
      "Indtast e-mail og adgangskode.";

    return;
  }


  loginButton.disabled = true;

  loginButton.textContent =
    "Logger ind...";


  const {
    data,
    error
  } =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  loginButton.disabled = false;

  loginButton.textContent =
    "Log ind";


  if (error) {

    loginError.textContent =
      "Login mislykkedes. Kontrollér oplysningerne.";

    return;
  }


  currentUser =
    data.user;

  passwordInput.value = "";

  await openChat();
}


loginButton.addEventListener(
  "click",
  login
);


passwordInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      login();
    }
  }
);


/* =========================================================
   FIND DEN ANDEN BRUGER
========================================================= */

async function findRecipient() {

  /*
    Vi kan ikke læse auth.users direkte fra browseren.

    Derfor finder vi modparten via en sikker
    databasefunktion, som vi opretter i næste trin.

    Indtil den funktion findes, viser appen en fejl.
  */

  const {
    data,
    error
  } =
    await supabaseClient.rpc(
      "get_chat_partner"
    );


  if (error) {

    console.error(error);

    throw new Error(
      "Kunne ikke finde chatpartner."
    );
  }


  if (!data) {

    throw new Error(
      "Ingen chatpartner fundet."
    );
  }


  recipientId = data;
}


/* =========================================================
   ÅBN CHAT
========================================================= */

async function openChat() {

  showOnly(chatScreen);

  statusText.textContent =
    "Forbinder...";


  try {

    await findRecipient();

    await loadMessages();

    startRealtime();

    statusText.textContent =
      "Synkroniseret";

  } catch (error) {

    console.error(error);

    statusText.textContent =
      "Forbindelsesfejl";

    messagesContainer.innerHTML =
      `
      <div class="empty-chat">
        Chatten mangler den sidste databaseindstilling.
      </div>
      `;
  }
}


/* =========================================================
   HENT BESKEDER
========================================================= */

async function loadMessages() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select("*")
      .or(
        `sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`
      )
      .order(
        "created_at",
        { ascending: true }
      );


  if (error) {

    throw error;
  }


  const now =
    new Date();


  const visibleMessages =
    (data || []).filter(message => {

      if (message.deleted_at) {
        return false;
      }

      if (
        message.delete_after &&
        new Date(message.delete_after) <= now
      ) {
        return false;
      }

      return true;
    });


  renderMessages(
    visibleMessages
  );
}


/* =========================================================
   VIS BESKEDER
========================================================= */

function renderMessages(messages) {

  messagesContainer.innerHTML = "";


  if (!messages.length) {

    messagesContainer.innerHTML =
      `
      <div class="empty-chat">
        Ingen noter endnu.
      </div>
      `;

    return;
  }


  messages.forEach(
    message => {

      const mine =
        message.sender_id === currentUser.id;

      const row =
        document.createElement("div");

      row.className =
        `message-row ${mine ? "mine" : "theirs"}`;


      const bubble =
        document.createElement("div");

      bubble.className =
        "bubble";


      const safeText =
        escapeHTML(
          message.message_text
        );


      let deleteButton = "";

      if (mine) {

        deleteButton =
          `
          <button
            class="delete-message"
            data-id="${message.id}"
            title="Slet"
          >
            🗑
          </button>
          `;
      }


      bubble.innerHTML =
        `
        <div class="message-text">
          ${safeText}
        </div>

        <div class="message-meta">
          ${formatTime(message.created_at)}
          ${deleteButton}
        </div>
        `;


      row.appendChild(
        bubble
      );

      messagesContainer.appendChild(
        row
      );
    }
  );


  document
    .querySelectorAll(
      ".delete-message"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          deleteMessage(
            button.dataset.id
          );
        }
      );
    });


  scrollToBottom();
}


/* =========================================================
   SEND BESKED
========================================================= */

async function sendMessage() {

  const text =
    messageInput.value.trim();


  if (
    !text ||
    !currentUser ||
    !recipientId
  ) {
    return;
  }


  let deleteAfter = null;

  const deleteChoice =
    deleteAfterSelect.value;

  const now =
    new Date();


  if (deleteChoice === "1h") {

    deleteAfter =
      new Date(
        now.getTime() +
        60 * 60 * 1000
      ).toISOString();
  }


  if (deleteChoice === "24h") {

    deleteAfter =
      new Date(
        now.getTime() +
        24 * 60 * 60 * 1000
      ).toISOString();
  }


  if (deleteChoice === "7d") {

    deleteAfter =
      new Date(
        now.getTime() +
        7 * 24 * 60 * 60 * 1000
      ).toISOString();
  }


  sendButton.disabled = true;


  const {
    error
  } =
    await supabaseClient
      .from("messages")
      .insert({
        sender_id:
          currentUser.id,

        recipient_id:
          recipientId,

        message_text:
          text,

        delete_after:
          deleteAfter
      });


  sendButton.disabled = false;


  if (error) {

    console.error(error);

    alert(
      "Beskeden kunne ikke sendes."
    );

    return;
  }


  messageInput.value = "";

  resizeMessageBox();

  await loadMessages();
}


sendButton.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {

      event.preventDefault();

      sendMessage();
    }
  }
);


/* =========================================================
   AUTO RESIZE TEXTAREA
========================================================= */

function resizeMessageBox() {

  messageInput.style.height =
    "44px";

  messageInput.style.height =
    Math.min(
      messageInput.scrollHeight,
      110
    ) + "px";
}


messageInput.addEventListener(
  "input",
  resizeMessageBox
);


/* =========================================================
   SLET BESKED
========================================================= */

async function deleteMessage(id) {

  const confirmed =
    confirm(
      "Vil du slette denne besked?"
    );


  if (!confirmed) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("messages")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(error);

    alert(
      "Beskeden kunne ikke slettes."
    );

    return;
  }


  await loadMessages();
}


/* =========================================================
   REALTIME
========================================================= */

function startRealtime() {

  if (realtimeChannel) {

    supabaseClient
      .removeChannel(
        realtimeChannel
      );
  }


  realtimeChannel =
    supabaseClient
      .channel(
        "private-chat"
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "messages"
        },

        payload => {

          const message =
            payload.new ||
            payload.old;


          if (!message) {
            return;
          }


          if (
            message.sender_id === currentUser.id ||
            message.recipient_id === currentUser.id
          ) {

            loadMessages();
          }
        }
      )
      .subscribe();
}


/* =========================================================
   SETTINGS
========================================================= */

settingsButton.addEventListener(
  "click",
  () => {

    settingsOverlay
      .classList
      .remove("hidden");
  }
);


closeSettingsButton.addEventListener(
  "click",
  () => {

    settingsOverlay
      .classList
      .add("hidden");
  }
);


settingsOverlay.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      settingsOverlay
    ) {

      settingsOverlay
        .classList
        .add("hidden");
    }
  }
);


/* =========================================================
   LÅS
========================================================= */

lockButton.addEventListener(
  "click",
  () => {

    settingsOverlay
      .classList
      .add("hidden");

    pinUnlocked = false;

    setupPinScreen();
  }
);


/* =========================================================
   SKIFT PIN
========================================================= */

changePinButton.addEventListener(
  "click",
  () => {

    const currentPin =
      prompt(
        "Indtast nuværende PIN:"
      );


    if (
      currentPin !==
      getSavedPin()
    ) {

      alert(
        "Forkert PIN."
      );

      return;
    }


    const newPin =
      prompt(
        "Vælg ny PIN på 4-6 cifre:"
      );


    if (
      !/^\d{4,6}$/.test(
        newPin || ""
      )
    ) {

      alert(
        "PIN skal være 4-6 tal."
      );

      return;
    }


    localStorage.setItem(
      "elektriker_handbog_pin",
      newPin
    );


    alert(
      "PIN-koden er ændret."
    );


    settingsOverlay
      .classList
      .add("hidden");
  }
);


/* =========================================================
   LOG UD
========================================================= */

logoutButton.addEventListener(
  "click",
  async () => {

    await supabaseClient
      .auth
      .signOut();


    currentUser = null;

    recipientId = null;


    if (realtimeChannel) {

      supabaseClient
        .removeChannel(
          realtimeChannel
        );

      realtimeChannel = null;
    }


    settingsOverlay
      .classList
      .add("hidden");


    emailInput.value = "";

    passwordInput.value = "";

    showOnly(
      loginScreen
    );
  }
);


/* =========================================================
   AUTO-LÅS NÅR APPEN FORLADES
========================================================= */

document.addEventListener(
  "visibilitychange",
  () => {

    if (
      document.hidden &&
      pinUnlocked
    ) {

      pinUnlocked = false;
    }


    if (
      !document.hidden &&
      !pinUnlocked
    ) {

      setupPinScreen();
    }
  }
);


/* =========================================================
   START APP
========================================================= */

setupPinScreen();

</script>

if ("serviceWorker" in navigator) {
  window.addEventListener("load", () => {
    navigator.serviceWorker.register("./service-worker.js");
  });
}
</script>
