/* =========================================================

let currentUser = null;

let callChannel = null;

/* =========================================================

function showOnly(screen) {

  pinScreen.classList.add("hidden");
  loginScreen.classList.add("hidden");
  chatScreen.classList.add("hidden");

  screen.classList.remove("hidden");
}


function escapeHTML(text) {

  const div =

  div.textContent =

  return div.innerHTML;
}


function formatTime(dateString) {

  return new Date(

/* =========================================================
   PIN
========================================================= */

const PIN_STORAGE_KEY =
  "elektriker_handbog_pin_secure";

const OLD_PIN_STORAGE_KEY =
  "elektriker_handbog_pin";


function hasSavedPin() {

  return !!(
    localStorage.getItem(PIN_STORAGE_KEY) ||
    localStorage.getItem(OLD_PIN_STORAGE_KEY)
  );
}


function bytesToBase64(bytes) {

  let binary = "";

  bytes.forEach(byte => {

    binary +=
      String.fromCharCode(byte);
  });

  return btoa(binary);
}


function base64ToBytes(base64) {

  const binary =
    atob(base64);

  return Uint8Array.from(
    binary,
    char => char.charCodeAt(0)
  );
}


async function createPinHash(
  pin,
  salt
) {

  const encoder =
    new TextEncoder();

  const keyMaterial =
    await crypto.subtle.importKey(
      "raw",
      encoder.encode(pin),
      "PBKDF2",
      false,
      ["deriveBits"]
    );

  const bits =
    await crypto.subtle.deriveBits(
      {
        name: "PBKDF2",
        salt,
        iterations: 200000,
        hash: "SHA-256"
      },
      keyMaterial,
      256
    );

  return new Uint8Array(bits);
}


async function savePinSecurely(pin) {

  const salt =
    crypto.getRandomValues(
      new Uint8Array(16)
    );

  const hash =
    await createPinHash(
      pin,
      salt
    );

  localStorage.setItem(
    PIN_STORAGE_KEY,
    JSON.stringify({
      salt:
        bytesToBase64(salt),

      hash:
        bytesToBase64(hash)
    })
  );

  localStorage.removeItem(
    OLD_PIN_STORAGE_KEY
  );
}


async function verifyPin(pin) {

  const recordString =
    localStorage.getItem(
      PIN_STORAGE_KEY
    );

  if (recordString) {

    try {

      const record =
        JSON.parse(recordString);

      const salt =
        base64ToBytes(
          record.salt
        );

      const oldHash =
        base64ToBytes(
          record.hash
        );

      const newHash =
        await createPinHash(
          pin,
          salt
        );

      if (
        oldHash.length !==
        newHash.length
      ) {
        return false;
      }

      let difference = 0;

      for (
        let i = 0;
        i < oldHash.length;
        i++
      ) {

        difference |=
          oldHash[i] ^
          newHash[i];
      }

      return difference === 0;

    } catch (error) {

      console.error(error);

      return false;
    }
  }


  const oldPin =
    localStorage.getItem(
      OLD_PIN_STORAGE_KEY
    );


  if (
    oldPin &&
    pin === oldPin
  ) {

    await savePinSecurely(
      pin
    );

    return true;
  }


  return false;
}


function setupPinScreen() {

  pinUnlocked = false;

  pinInput.value = "";
  pinError.textContent = "";

  if (hasSavedPin()) {

    pinSetupText.textContent =
      "Indtast din personlige PIN";

    pinButton.textContent =
      "Åbn håndbog";

  } else {

    pinSetupText.textContent =
      "Første gang: vælg en PIN på 4-6 cifre";

    pinButton.textContent =
      "Gem PIN";
  }

  showOnly(
    pinScreen
  );
}


async function handlePin() {

  const pin =
    pinInput.value.trim();

  if (
    !/^\d{4,6}$/.test(pin)
  ) {

    pinError.textContent =
      "PIN skal være 4-6 tal.";

    return;
  }


  pinButton.disabled = true;


  if (!hasSavedPin()) {

    await savePinSecurely(
      pin
    );

    pinUnlocked = true;

    pinButton.disabled = false;

    await continueAfterPin();

    return;
  }


  const correct =
    await verifyPin(
      pin
    );


  pinButton.disabled = false;


  if (!correct) {

    pinError.textContent =
      "Forkert PIN.";

    pinInput.value = "";

    return;
  }


  pinUnlocked = true;

  await continueAfterPin();
}


async function continueAfterPin() {

  const {
    data: { session }
  } =
    await supabaseClient
      .auth
      .getSession();


  if (session?.user) {

    currentUser =
      session.user;

    await openChat();

  } else {

    showOnly(
      loginScreen
    );
  }
}


pinButton.addEventListener(

);


pinInput.addEventListener(

  event => {

    if (

);


/* =========================================================

async function login() {

  loginError.textContent = "";

  const email =
    emailInput.value.trim();

async function loadMessages() {

  const {
    data,
    error
  } =
    await supabaseClient
      .from("messages")
      .select("*")
      .or(
        `sender_id.eq.${currentUser.id},recipient_id.eq.${currentUser.id}`
      )
      .order(
        "created_at",
        {
          ascending: true
        }
      );


  if (error) {
    throw error;
  }


  const now =
    Date.now();


  const messages =
    (data || []).filter(message => {

      if (message.deleted_at) {
        return false;
      }

      if (
        message.delete_after &&
        new Date(
          message.delete_after
        ).getTime() <= now
      ) {
        return false;
      }

      return true;
    });


  renderMessages(
    messages
  );
}


function renderMessages(messages) {

  messagesContainer.innerHTML = "";


  if (!messages.length) {

    messagesContainer.innerHTML =
      `
      <div class="empty-chat">
        Ingen noter endnu.
      </div>
      `;

    return;
  }


  messages.forEach(message => {

    const mine =
      message.sender_id ===
      currentUser.id;


    const row =
      document.createElement("div");

    row.className =
      "message-row " +
      (
        mine
        ? "mine"
        : "theirs"
      );


    const bubble =
      document.createElement("div");

    bubble.className =
      "bubble";


    const deleteButton =
      mine
      ? `
          <button
            class="delete-message"
            data-id="${message.id}"
          >
            🗑
          </button>
        `
      : "";


    bubble.innerHTML =
      `
      <div class="message-text">
        ${escapeHTML(
          message.message_text
        )}
      </div>

      <div class="message-meta">
        ${formatTime(
          message.created_at
        )}

        ${deleteButton}
      </div>
      `;


    row.appendChild(
      bubble
    );

    messagesContainer.appendChild(
      row
    );
  });


  document
    .querySelectorAll(
      ".delete-message"
    )
    .forEach(button => {

      button.addEventListener(
        "click",
        () =>
          deleteMessage(
            button.dataset.id
          )
      );
    });


  scrollToBottom();
}


async function sendMessage() {

  const text =
    messageInput.value.trim();


  if (
    !text ||
    !currentUser ||
    !recipientId
  ) {
    return;
  }


  const choice =
    deleteAfterSelect.value;

  let deleteAfter = null;

  const now =
    Date.now();


  if (choice === "1h") {

    deleteAfter =
      new Date(
        now +
        60 * 60 * 1000
      ).toISOString();

  } else if (
    choice === "24h"
  ) {

    deleteAfter =
      new Date(
        now +
        24 * 60 * 60 * 1000
      ).toISOString();

  } else if (
    choice === "7d"
  ) {

    deleteAfter =
      new Date(
        now +
        7 * 24 * 60 * 60 * 1000
      ).toISOString();
  }


  sendButton.disabled = true;


  const {
    error
  } =
    await supabaseClient
      .from("messages")
      .insert({
        sender_id:
          currentUser.id,

        recipient_id:
          recipientId,

        message_text:
          text,

        delete_after:
          deleteAfter
      });


  sendButton.disabled = false;


  if (error) {

    console.error(error);

    alert(
      "Beskeden kunne ikke sendes."
    );

    return;
  }


  messageInput.value = "";

  resizeMessageBox();

  await loadMessages();
}


async function deleteMessage(id) {

  if (
    !confirm(
      "Vil du slette denne besked?"
    )
  ) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("messages")
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    console.error(error);

    alert(
      "Beskeden kunne ikke slettes."
    );

    return;
  }


  await loadMessages();
}

function startMessageRealtime() {

  if (realtimeChannel) {

    supabaseClient.removeChannel(
      realtimeChannel
    );
  }


  realtimeChannel =
    supabaseClient
      .channel(
        "private-chat-" +
        currentUser.id
      )
      .on(
        "postgres_changes",
        {
          event: "*",
          schema: "public",
          table: "messages"
        },
        payload => {

          const message =
            payload.new ||
            payload.old;

          if (!message) {
            return;
          }

          if (
            message.sender_id ===
              currentUser.id ||

            message.recipient_id ===
              currentUser.id
          ) {

            loadMessages();
          }
        }
      )
      .subscribe();
}

async function sendCallSignal(
  signalType,
  payload = {}
) {

  if (
    !currentUser ||
    !recipientId
  ) {
    return;
  }


  const {
    error
  } =
    await supabaseClient
      .from("call_signals")
      .insert({
        sender_id:
          currentUser.id,

        recipient_id:
          recipientId,

        signal_type:
          signalType,

        payload
      });


  if (error) {

    console.error(
      "Call signal error:",
      error
    );
  }
}


function createPeerConnection() {

  if (peerConnection) {

    peerConnection.close();
  }


  peerConnection =
    new RTCPeerConnection(
      RTC_CONFIG
    );


  peerConnection.onicecandidate =
    event => {

      if (
        event.candidate
      ) {

        sendCallSignal(
          "ice-candidate",
          {
            candidate:
              event.candidate.toJSON()
          }
        );
      }
    };


  peerConnection.ontrack =
    event => {

      if (
        event.streams &&
        event.streams[0]
      ) {

        remoteVideo.srcObject =
          event.streams[0];

        remoteVideo
          .play()
          .catch(() => {});
      }
    };


  peerConnection.onconnectionstatechange =
    () => {

      if (!peerConnection) {
        return;
      }

      const state =
        peerConnection
          .connectionState;


      if (
        state === "connected"
      ) {

        callStatus.textContent =
          "Forbundet";

      } else if (
        state === "connecting"
      ) {

        callStatus.textContent =
          "Forbinder...";

      } else if (
        state === "failed"
      ) {

        callStatus.textContent =
          "Kunne ikke forbinde";

      } else if (
        state === "disconnected"
      ) {

        callStatus.textContent =
          "Forbindelsen blev afbrudt";
      }
    };


  if (localStream) {

    localStream
      .getTracks()
      .forEach(track => {

        peerConnection.addTrack(
          track,
          localStream
        );
      });
  }


  return peerConnection;
}


async function getLocalMedia(type) {

  try {

    localStream =
      await navigator.mediaDevices
        .getUserMedia({

          audio: true,

          video:
            type === "video"
            ? {
                facingMode:
                  "user"
              }
            : false
        });


    if (
      type === "video"
    ) {

      localVideo.srcObject =
        localStream;

      localVideo.classList.remove(
        "hidden"
      );

      remoteVideo.classList.remove(
        "hidden"
      );

      cameraButton.classList.remove(
        "hidden"
      );

    } else {

      localVideo.classList.add(
        "hidden"
      );

      remoteVideo.classList.add(
        "hidden"
      );

      cameraButton.classList.add(
        "hidden"
      );
    }


    return true;

  } catch (error) {

    console.error(error);

    alert(
      type === "video"
      ? "Du skal give adgang til mikrofon og kamera."
      : "Du skal give adgang til mikrofonen."
    );

    return false;
  }
}

async function startCall(type) {

  if (
    !currentUser ||
    !recipientId
  ) {

    alert(
      "Chatten er ikke klar."
    );

    return;
  }


  if (peerConnection) {

    alert(
      "Der er allerede et opkald i gang."
    );

    return;
  }


  currentCallType =
    type;


  showOutgoingCallUI(
    type
  );


  const ready =
    await getLocalMedia(
      type
    );


  if (!ready) {

    closeCallLocally();

    return;
  }


  createPeerConnection();


  const offer =
    await peerConnection
      .createOffer();


  await peerConnection
    .setLocalDescription(
      offer
    );


  await sendCallSignal(
    "offer",
    {
      callType:
        type,

      sdp:
        peerConnection
          .localDescription
          .toJSON()
    }
  );


  callStatus.textContent =
    "Ringer...";
}

async function handleIncomingOffer(
  signal
) {

  if (peerConnection) {

    await sendCallSignal(
      "busy"
    );

    return;
  }


  const sdp =
    signal.payload?.sdp;

  const type =
    signal.payload?.callType ||
    "audio";


  if (!sdp) {
    return;
  }


  pendingIncomingCall = {
    signal,
    sdp,
    type
  };


  showIncomingCallUI(
    type
  );
}


async function acceptIncomingCall() {

  if (!pendingIncomingCall) {
    return;
  }


  const {
    sdp,
    type
  } =
    pendingIncomingCall;


  currentCallType =
    type;


  incomingActions.classList.add(
    "hidden"
  );

  activeCallActions.classList.remove(
    "hidden"
  );

  callStatus.textContent =
    "Besvarer...";


  const ready =
    await getLocalMedia(
      type
    );


  if (!ready) {

    await sendCallSignal(
      "decline"
    );

    closeCallLocally();

    return;
  }


  createPeerConnection();


  await peerConnection
    .setRemoteDescription(
      new RTCSessionDescription(
        sdp
      )
    );


  await flushQueuedIceCandidates();


  const answer =
    await peerConnection
      .createAnswer();


  await peerConnection
    .setLocalDescription(
      answer
    );


  await sendCallSignal(
    "answer",
    {
      sdp:
        peerConnection
          .localDescription
          .toJSON()
    }
  );


  pendingIncomingCall =
    null;


  callStatus.textContent =
    "Forbinder...";
}


async function declineIncomingCall() {

  await sendCallSignal(
    "decline"
  );

  pendingIncomingCall =
    null;

  closeCallLocally();
}


/* =========================================================
   ANSWER
========================================================= */

async function handleAnswer(signal) {

  if (
    !peerConnection ||
    !signal.payload?.sdp
  ) {
    return;
  }


  try {

    await peerConnection
      .setRemoteDescription(
        new RTCSessionDescription(
          signal.payload.sdp
        )
      );


    await flushQueuedIceCandidates();


    callStatus.textContent =
      "Forbinder...";

  } catch (error) {

    console.error(
      "Answer error:",
      error
    );
  }
}


/* =========================================================
   ICE
========================================================= */

async function handleIceCandidate(
  signal
) {

  const candidate =
    signal.payload?.candidate;


  if (!candidate) {
    return;
  }


  if (
    !peerConnection ||
    !peerConnection.remoteDescription
  ) {

    queuedIceCandidates.push(
      candidate
    );

    return;
  }


  try {

    await peerConnection
      .addIceCandidate(
        new RTCIceCandidate(
          candidate
        )
      );

  } catch (error) {

    console.error(
      "ICE error:",
      error
    );
  }
}


async function flushQueuedIceCandidates() {

  if (
    !peerConnection ||
    !peerConnection.remoteDescription
  ) {
    return;
  }


  const candidates =
    [...queuedIceCandidates];

  queuedIceCandidates = [];


  for (
    const candidate
    of candidates
  ) {

    try {

      await peerConnection
        .addIceCandidate(
          new RTCIceCandidate(
            candidate
          )
        );

    } catch (error) {

      console.error(error);
    }
  }
}


/* =========================================================
   CALL SIGNALER
========================================================= */

async function handleCallSignal(
  signal
) {
    if (signal?.id) {

    if (
      processedCallSignalIds.has(
        signal.id
      )
    ) {
      return;
    }

    processedCallSignalIds.add(
      signal.id
    );
  }

  if (
    !signal ||
    !currentUser ||
    signal.recipient_id !==
      currentUser.id
  ) {
    return;
  }


  switch (
    signal.signal_type
  ) {

    case "offer":

      await handleIncomingOffer(
        signal
      );

      break;


    case "answer":

      await handleAnswer(
        signal
      );

      break;


    case "ice-candidate":

      await handleIceCandidate(
        signal
      );

      break;


    case "decline":

      callStatus.textContent =
        "Opkaldet blev afvist";

      setTimeout(
        closeCallLocally,
        900
      );

      break;


    case "busy":

      callStatus.textContent =
        "Optaget";

      setTimeout(
        closeCallLocally,
        900
      );

      break;


    case "hangup":

      callStatus.textContent =
        "Opkald afsluttet";

      setTimeout(
        closeCallLocally,
        500
      );

      break;
  }
}

async function initializeCallPolling() {

  if (!currentUser) {
    return;
  }

  processedCallSignalIds.clear();

  const {
    data,
    error
  } =
    await supabaseClient
      .from("call_signals")
      .select("id")
      .eq(
        "recipient_id",
        currentUser.id
      )
      .order(
        "id",
        {
          ascending: false
        }
      )
      .limit(20);


  if (error) {

    console.error(
      "Kunne ikke starte call polling:",
      error
    );

  } else {

    for (
      const signal
      of data || []
    ) {

      processedCallSignalIds.add(
        signal.id
      );
    }
  }


  if (callPollingTimer) {

    clearInterval(
      callPollingTimer
    );
  }


  callPollingTimer =
    setInterval(
      pollCallSignals,
      1000
    );


  // Kør også med det samme
  setTimeout(
    pollCallSignals,
    250
  );
}


async function pollCallSignals() {

  if (!currentUser) {
    return;
  }


  const {
    data,
    error
  } =
    await supabaseClient
      .from("call_signals")
      .select("*")
      .eq(
        "recipient_id",
        currentUser.id
      )
      .order(
        "id",
        {
          ascending: false
        }
      )
      .limit(30);
  statusText.textContent =
  error
    ? "CALL TEST: databasefejl"
    : `CALL TEST: ${data?.length || 0} signaler`;


  if (error) {

    console.error(
      "Call polling error:",
      error
    );

    return;
  }


  const newSignals =
    (data || [])
      .filter(
        signal =>
          !processedCallSignalIds.has(
            signal.id
          )
      )
      .sort(
        (a, b) =>
          Number(a.id) -
          Number(b.id)
      );
statusText.textContent =
  `CALL TEST: ${data?.length || 0} total / ${newSignals.length} nye`;

  for (
    const signal
    of newSignals
  ) {

    await handleCallSignal(
      signal
    );
  }
}

/* =========================================================
   GAMLE CALL SIGNALER
========================================================= */

async function deleteOldCallSignals() {

  if (!currentUser) {
    return;
  }


  const oneHourAgo =
    new Date(
      Date.now() -
      60 * 60 * 1000
    ).toISOString();


  await supabaseClient
    .from("call_signals")
    .delete()
    .lt(
      "created_at",
      oneHourAgo
    );
}

changePinButton.addEventListener(
  "click",
  async () => {

    const oldPin =
      prompt(
        "Indtast nuværende PIN:"
      );


    if (!oldPin) {
      return;
    }


    const correct =
      await verifyPin(
        oldPin
      );


    if (!correct) {

      alert(
        "Forkert PIN."
      );

      return;
    }


    const newPin =
      prompt(
        "Vælg ny PIN på 4-6 cifre:"
      );


    if (
      !/^\d{4,6}$/.test(
        newPin || ""
      )
    ) {

      alert(
        "PIN skal være 4-6 tal."
      );

      return;
    }


    await savePinSecurely(
      newPin
    );


    settingsOverlay.classList.add(
      "hidden"
    );


    alert(
      "PIN-koden er ændret."
    );
  }
);

  "click",
  async () => {

    closeCallLocally();


    if (realtimeChannel) {

      supabaseClient.removeChannel(

      );

      realtimeChannel =
        null;
    }


    if (callChannel) {

      supabaseClient.removeChannel(
        callChannel
      );

      callChannel =
        null;
    }

if (callPollingTimer) {

  clearInterval(

}
    await supabaseClient

    currentUser =

/* =========================================================
   SERVICE WORKER / CACHE
   MIDlERTIDIGT FRAKOBLET UNDER TEST
========================================================= */

async function removeOldServiceWorker() {

  if (
    "serviceWorker"
    in navigator
  ) {

    const registrations =
      await navigator
        .serviceWorker
        .getRegistrations();


    registrations.forEach(
      registration => {

        registration.unregister();
      }
    );
  }


  if (
    "caches"
    in window
  ) {

    const names =
      await caches.keys();


    names.forEach(
      name => {

        caches.delete(
          name
        );
      }
    );
  }
}


/* =========================================================
   START
========================================================= */

removeOldServiceWorker();
